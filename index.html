<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">

</head>
<body>

  <header class="site-header">
    <div class="wrap header-inner">
      <h1 class="logo">Ledger<span>.</span></h1>
      <label class="home-currency">
        <span>Home currency</span>
        <select id="home-currency" aria-label="Home currency"></select>
      </label>
    </div>
  </header>


  <main class="wrap">
    <section class="summary" aria-live="polite">
      <p class="totalbig">Total spent</p>
      <p class="total" id="total">—</p>
      <p class="status" id="status">Loading exchange rates…</p>
    </section>

    <div class="grid">
      <section class="card" aria-labelledby="add-title">
        <h2 id="add-title">Add an expense</h2>
        <form id="expense-form" novalidate>
          <label>Description
            <input id="description" type="text" placeholder="e.g. Lunch with team" required />
          </label>
          <div class="row">
            <label>Amount
              <input id="amount" type="number" min="0.01" step="0.01" placeholder="0.00" required />
            </label>
            <label>Currency
              <select id="currency"></select>
            </label>
          </div>
          <label>Category
            <select id="category"></select>
          </label>
          <p class="form-error" id="form-error" role="alert"></p>
          <button type="submit" class="btn">Add expense</button>
        </form>
      </section>


    <section class="filter-section">

        <select id="filterCategory">
            <option value="All">All Categories</option>
            <option value="Food">Food</option>
            <option value="Transport">Transport</option>
            <option value="Shopping">Shopping</option>
            <option value="Utilities">Utilities</option>
        </select>

    </section>

    <div id="status"></div>

    <section id="expenseList" class="expense-list"></section>

</body>
</html>
