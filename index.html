<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">

</head>
<body>

    <div class="container">

    <header class="header">
        <div>
            <h1>Expense Tracker</h1>
            <p>Track and mange your spending.</p>
        </div>

        <select id="homeCurrency">
            <option value="KES">USD</option>
            <option value="EUR">EUR</option>
            <option value="GBP">GBP</option>
            <option value="USD">KES</option>
        </select>
    </header>

    <section class="stats">

        <article class="stat-card">
            <span>Total Spending</span>
            <h2 id="totalAmount">0.00</h2>
        </article>

        <article class="stat-card">
            <span>Home Currency</span>
            <h2 id="currencyDisplay">KES</h2>
        </article>

        <article class="stat-card">
            <span>Expenses</span>
            <h2 id="expenseCount">0</h2>
        </article>

    </section>

    <section class="form-card">

        <h3>Add Expense</h3>

        <form id="expenseForm">

            <input
                type="text"
                id="description"
                placeholder="Description"
                required
            >

            <input
                type="number"
                id="amount"
                placeholder="Amount"
                step="0.01"
                required
            >

            <select id="currency">
                <option>KES</option>
                <option>EUR</option>
                <option>GBP</option>
                <option></option>
            </select>

            <select id="category">
                <option>Food</option>
                <option>Transport</option>
                <option>Shopping</option>
                <option>Utilities</option>
            </select>

            <button type="submit">
                Add Expense
            </button>

        </form>

    </section>
    
</body>
</html>
