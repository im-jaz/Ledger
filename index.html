<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">

</head>
<body>

  <header class="site-header">
    <div class="wrap header-inner">
      <h1 class="logo">Ledger<span>.</span></h1>
      <label class="home-currency">
        <span>Home currency</span>
        <select id="home-currency" aria-label="Home currency"></select>
      </label>
    </div>
  </header>

    <section class="stats">

        <article class="stat-card">
            <span>Total Spending</span>
            <h2 id="totalAmount">0.00</h2>
        </article>

        <article class="stat-card">
            <span>Home Currency</span>
            <h2 id="currencyDisplay">KES</h2>
        </article>

        <article class="stat-card">
            <span>Expenses</span>
            <h2 id="expenseCount">0</h2>
        </article>

    </section>

    <section class="form-card">

        <h3>Add Expense</h3>

        <form id="expenseForm">

            <input
                type="text"
                id="description"
                placeholder="Description"
                required
            >

            <input
                type="number"
                id="amount"
                placeholder="Amount"
                step="0.01"
                required
            >

            <select id="currency">
                <option>KES</option>
                <option>EUR</option>
                <option>GBP</option>
                <option></option>
            </select>

            <select id="category">
                <option>Food</option>
                <option>Transport</option>
                <option>Shopping</option>
                <option>Utilities</option>
            </select>

            <button type="submit">
                Add Expense
            </button>

        </form>

    </section>


    <section class="filter-section">

        <select id="filterCategory">
            <option value="All">All Categories</option>
            <option value="Food">Food</option>
            <option value="Transport">Transport</option>
            <option value="Shopping">Shopping</option>
            <option value="Utilities">Utilities</option>
        </select>

    </section>

    <div id="status"></div>

    <section id="expenseList" class="expense-list"></section>

</body>
</html>
